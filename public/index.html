<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<title>JARVIS — IP BABA AI Assistant</title>

<style>
:root{
  --bg:#03060b;
  --panel:#07111d;
  --panel2:#0a1624;
  --line:rgba(93,128,167,.28);
  --muted:#91a7bb;
  --text:#edf8ff;
  --cyan:#00e5ff;
  --blue:#1188ff;
  --red:#e50914;
  --green:#45ffaf;
  --shadow:0 18px 60px rgba(0,0,0,.38);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 8%,#0c1b39 0,#03060b 42%,#010204 100%);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.25;
  background:
    linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:
    linear-gradient(
      to bottom,
      #000 0,
      #000 55%,
      transparent 100%
    );
}

.app{
  width:min(1440px,100%);
  height:100dvh;
  margin:0 auto;
  padding:10px 14px;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:10px;
  position:relative;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  min-height:58px;
}

.brand-side{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-word{
  font-size:.7rem;
  letter-spacing:.16em;
  color:#89a8bc;
  font-weight:700;
}

.logo-shell{
  width:58px;
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  position:relative;
  border-radius:15px;
  background:#fff;
  box-shadow:
    0 0 24px rgba(0,229,255,.08),
    0 8px 25px rgba(0,0,0,.28);
  isolation:isolate;
}

.logo-shell:before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:17px;
  background:
    conic-gradient(
      from 0deg,
      var(--red),
      transparent 28%,
      var(--cyan) 56%,
      transparent 76%,
      var(--red)
    );
  z-index:-1;
  animation:spinBorder 7s linear infinite;
}

.logo-shell:after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:13px;
  background:#fff;
  z-index:-1;
}

@keyframes spinBorder{
  to{
    transform:rotate(360deg);
  }
}

.logo-shell img{
  width:78%;
  height:78%;
  object-fit:contain;
  display:block;
}

.title-wrap{
  text-align:center;
}

.title{
  margin:0;
  font-size:1.45rem;
  letter-spacing:.27em;
  font-weight:900;
}

.subtitle{
  margin:2px 0 0;
  color:var(--muted);
  font-size:.7rem;
  letter-spacing:.12em;
}

.secure{
  justify-self:end;
  color:#9fc2cf;
  font-size:.67rem;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:999px;
  background:rgba(0,229,255,.035);
  white-space:nowrap;
}

.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(360px,43%) minmax(0,57%);
  gap:12px;
}

.visual-panel,
.chat-panel{
  min-height:0;
  border:1px solid var(--line);
  background:
    linear-gradient(
      180deg,
      rgba(8,17,29,.9),
      rgba(4,9,16,.86)
    );
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.visual-panel{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:14px;
  isolation:isolate;
}

.visual-panel:after{
  content:"";
  position:absolute;
  inset:10%;
  background:
    radial-gradient(
      circle,
      rgba(0,229,255,.12),
      transparent 65%
    );
  filter:blur(26px);
  pointer-events:none;
  z-index:-1;
}

.visual-head{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#86a0b5;
  font-size:.68rem;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.visual-head strong{
  color:#c8ebf5;
  font-size:.72rem;
}

.robot-wrap{
  position:relative;
  width:min(560px,100%);
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  flex:1;
  min-height:0;
}

.robot-wrap canvas{
  width:100%;
  height:100%;
  display:block;
}

.binary{
  position:absolute;
  inset:4%;
  pointer-events:none;
  overflow:hidden;
  border-radius:50%;
  opacity:.45;
  mask-image:
    radial-gradient(
      circle,
      #000 15%,
      rgba(0,0,0,.85) 48%,
      transparent 76%
    );
}

.binary span{
  position:absolute;
  color:rgba(0,229,255,.45);
  font:
    600 10px/1
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
  white-space:nowrap;
  animation:
    floatCode var(--dur) linear infinite;
  animation-delay:var(--delay);
  left:var(--x);
}

@keyframes floatCode{
  0%{
    transform:
      translateY(110%)
      rotate(var(--rot));
    opacity:0;
  }

  12%,
  88%{
    opacity:.65;
  }

  100%{
    transform:
      translateY(-25%)
      rotate(var(--rot));
    opacity:0;
  }
}

.state-line{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  color:#a8c3d4;
  font-size:.72rem;
  letter-spacing:.14em;
  margin-top:3px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4e5e6e;
}

.status-dot.ok{
  background:var(--green);
  box-shadow:0 0 12px rgba(69,255,175,.9);
}

.status-dot.busy{
  background:var(--cyan);
  box-shadow:0 0 12px rgba(0,229,255,.9);
  animation:pulse 1s infinite;
}

.status-dot.err{
  background:#ff4050;
  box-shadow:0 0 12px rgba(255,64,80,.9);
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

.visual-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  padding-top:8px;
}

.btn{
  min-height:40px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(12,22,36,.9);
  color:#fff;
  padding:9px 12px;
  font-weight:750;
  transition:
    .18s transform,
    .18s border-color,
    .18s background;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:rgba(0,229,255,.65);
}

.btn:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

.btn.primary{
  border:0;
  background:
    linear-gradient(
      100deg,
      var(--blue),
      var(--cyan)
    );
  color:#001018;
}

.btn.live{
  min-width:175px;
}

.btn.live.on{
  background:
    linear-gradient(
      100deg,
      #a90310,
      var(--red)
    );
  color:#fff;
}

.btn svg{
  width:18px;
  height:18px;
  vertical-align:-4px;
  margin-right:6px;
}

.btn.icon{
  width:44px;
  padding:8px;
}

.btn.icon svg{
  margin:0;
  width:20px;
  height:20px;
}

.btn.danger{
  border-color:rgba(229,9,20,.55);
}

.chat-panel{
  display:flex;
  flex-direction:column;
  padding:10px;
  min-width:0;
}

.chat-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px 4px 9px;
  flex:0 0 auto;
}

.chat-head h2{
  margin:0;
  font-size:.88rem;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.chat-head span{
  color:#7992a8;
  font-size:.68rem;
}

.quick{
  display:flex;
  gap:7px;
  overflow:auto;
  flex:0 0 auto;
  padding:0 2px 9px;
  scrollbar-width:thin;
}

.quick.hidden{
  display:none;
}

.quick button{
  white-space:nowrap;
  min-height:37px;
  padding:7px 10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#091524;
  color:#d8edf7;
  font-size:.72rem;
}

.quick button:hover{
  border-color:rgba(0,229,255,.55);
}

.chat{
  min-height:0;
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  padding:4px 5px 8px;
  display:flex;
  flex-direction:column;
  gap:9px;
  scroll-behavior:smooth;
}

.bubble{
  max-width:min(88%,760px);
  padding:10px 12px;
  border-radius:15px;
  line-height:1.58;
  font-size:.91rem;
  overflow-wrap:anywhere;
}

.bubble.user{
  align-self:flex-end;
  background:
    linear-gradient(
      135deg,
      #123e70,
      #0a2949
    );
  border:1px solid rgba(52,146,255,.28);
  white-space:pre-wrap;
}

.bubble.ai{
  align-self:flex-start;
  background:rgba(17,28,43,.94);
  border:1px solid rgba(0,229,255,.14);
  border-left:3px solid var(--cyan);
}

.bubble.ai p{
  margin:.35em 0;
}

.bubble.ai ul,
.bubble.ai ol{
  margin:.35em 0;
  padding-left:1.25em;
}

.bubble.ai h3{
  margin:.55em 0 .25em;
  font-size:.98rem;
  color:#9deeff;
}

.bubble.ai code{
  background:#050b12;
  border:1px solid #1a2b40;
  border-radius:5px;
  padding:1px 4px;
}

.bubble.ai pre{
  white-space:pre-wrap;
  background:#050b12;
  border:1px solid #1a2b40;
  border-radius:9px;
  padding:10px;
  overflow:auto;
}

.typing{
  opacity:.68;
  font-style:italic;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px;
}

.mini{
  border:1px solid var(--line);
  background:#08111c;
  color:#d8f3ff;
  border-radius:8px;
  padding:5px 8px;
  font-size:.7rem;
}

.mini.cta{
  border-color:rgba(229,9,20,.55);
  background:
    linear-gradient(
      90deg,
      #a40712,
      var(--red)
    );
  color:#fff;
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
  flex:0 0 auto;
  margin-top:8px;
  padding:7px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(6,13,22,.96);
}

.composer textarea{
  flex:1;
  resize:none;
  min-height:44px;
  max-height:128px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 8px;
  line-height:1.45;
}

.composer textarea::placeholder{
  color:#698296;
}

.send-btn{
  flex:0 0 auto;
}

.footer{
  flex:0 0 auto;
  text-align:center;
  color:#667d92;
  font-size:.62rem;
  padding:7px 0 2px;
}

/* ===== LIVE VOICE OVERLAY ===== */

.live-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.74);
  backdrop-filter:blur(10px);
  display:grid;
  place-items:center;
  padding:14px;
}

.live-overlay.hidden{
  display:none;
}

.live-card{
  width:min(940px,100%);
  height:min(760px,calc(100dvh - 28px));
  background:#07111d;
  border:1px solid rgba(0,229,255,.3);
  border-radius:24px;
  box-shadow:0 28px 100px rgba(0,0,0,.62);
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
}

.live-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}

.live-top h3{
  margin:0;
  font-size:.9rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.live-top span{
  font-size:.67rem;
  color:#7690a6;
}

.live-stage{
  position:relative;
  display:grid;
  place-items:center;
  padding:16px;
  background:#f8fbff;
  min-height:0;
}

.live-stage:before{
  content:"";
  position:absolute;
  inset:12% 20%;
  background:
    radial-gradient(
      circle,
      rgba(0,229,255,.16),
      transparent 64%
    );
  filter:blur(18px);
}

.live-stage canvas{
  width:min(620px,100%);
  height:min(620px,100%);
  display:block;
  position:relative;
  z-index:1;
}

.live-info{
  padding:11px 14px;
  border-top:1px solid var(--line);
  background:#07111d;
}

.live-status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.live-status strong{
  font-size:.75rem;
  letter-spacing:.13em;
}

.live-status span{
  font-size:.72rem;
  color:#91a7ba;
  text-align:right;
}

.live-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:9px;
}

.error-box{
  margin-top:8px;
  color:#ffc5ca;
  background:rgba(229,9,20,.08);
  border:1px solid rgba(229,9,20,.28);
  padding:8px 9px;
  border-radius:9px;
  font-size:.7rem;
  display:none;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

@media(max-width:900px){

  .app{
    padding:8px 10px;
    gap:8px;
  }

  .workspace{
    grid-template-columns:1fr;
    grid-template-rows:
      minmax(270px,40%)
      minmax(0,60%);
  }

  .visual-panel{
    padding:9px;
    border-radius:18px;
  }

  .visual-head{
    font-size:.61rem;
  }

  .robot-wrap{
    max-height:none;
  }

  .visual-actions{
    padding-top:4px;
  }

  .chat-panel{
    border-radius:18px;
    padding:8px;
  }

  .chat-head{
    padding:0 4px 7px;
  }

  .bubble{
    max-width:94%;
  }

  .secure{
    display:none;
  }
}

@media(max-width:560px){

  .app{
    padding:6px 7px;
  }

  .topbar{
    grid-template-columns:1fr auto;
    grid-template-areas:
      "title logo";
    min-height:52px;
  }

  .brand-side{
    display:none;
  }

  .title-wrap{
    grid-area:title;
    text-align:left;
  }

  .title{
    font-size:1.18rem;
    letter-spacing:.2em;
  }

  .subtitle{
    font-size:.62rem;
  }

  .logo-shell{
    grid-area:logo;
    width:52px;
  }

  .workspace{
    grid-template-rows:
      minmax(230px,36%)
      minmax(0,64%);
    gap:7px;
  }

  .visual-panel{
    min-height:0;
  }

  .visual-head strong{
    font-size:.62rem;
  }

  .visual-actions .btn.newchat,
  .visual-actions .btn.clear{
    display:none;
  }

  .quick button{
    font-size:.68rem;
  }

  .chat{
    padding-bottom:4px;
  }

  .composer textarea{
    font-size:.88rem;
  }

  .footer{
    font-size:.58rem;
  }

  .live-card{
    height:calc(100dvh - 12px);
    border-radius:18px;
  }

  .live-stage{
    padding:8px;
  }

  .live-status{
    align-items:flex-start;
    flex-direction:column;
    gap:3px;
  }

  .live-status span{
    text-align:left;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<main class="app" id="jv">

  <header class="topbar">

    <div class="brand-side">
      <div class="logo-shell">
        <img
          src="/assets/ipbaba-logo.png"
          alt="IP BABA logo"
          id="brandLogo"
        >
      </div>

      <span class="brand-word">
        IP BABA
      </span>
    </div>

    <div class="title-wrap">
      <h1 class="title">JARVIS</h1>
      <p class="subtitle">
        AI Assistant of IP BABA
      </p>
    </div>

    <div class="secure">
      Secure AI Connection
    </div>

  </header>


  <section class="workspace">

    <!-- ================= VISUAL PANEL ================= -->

    <section
      class="visual-panel"
      aria-label="JARVIS AI interface"
    >

      <div class="visual-head">
        <span>AI Visual Core</span>
        <strong id="visualState">
          JARVIS READY
        </strong>
      </div>

      <div class="robot-wrap">

        <div
          class="binary"
          id="binaryMain"
        ></div>

        <canvas id="robotMain"></canvas>

      </div>

      <div class="state-line">

        <span
          id="mainDot"
          class="status-dot ok"
        ></span>

        <span id="mainConn">
          Ready
        </span>

      </div>

      <div class="visual-actions">

        <button
          id="liveBtn"
          class="btn primary live"
          type="button"
          aria-label="Start live voice"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect
              x="9"
              y="2"
              width="6"
              height="13"
              rx="3"
            ></rect>

            <path
              d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"
            />

          </svg>

          Talk Live

        </button>


        <button
          id="newBtn"
          class="btn newchat"
          type="button"
        >
          New Chat
        </button>


        <button
          id="clearBtn"
          class="btn clear"
          type="button"
        >
          Clear
        </button>

      </div>

    </section>


    <!-- ================= CHAT PANEL ================= -->

    <section
      class="chat-panel"
      aria-label="JARVIS text chat"
    >

      <div class="chat-head">

        <h2>
          Conversation
        </h2>

        <span>
          Text Chat
        </span>

      </div>


      <div
        id="quick"
        class="quick"
      ></div>


      <section
        id="chat"
        class="chat"
        aria-live="polite"
      ></section>


      <form
        id="composer"
        class="composer"
      >

        <textarea
          id="input"
          rows="1"
          placeholder="Ask JARVIS about AI, marketing, business, IP BABA, or request a professional prompt…"
        ></textarea>


        <!-- microphone -->

        <button
          id="micBtn"
          class="btn icon"
          type="button"
          title="Voice typing"
          aria-label="Voice typing"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <rect
              x="9"
              y="2"
              width="6"
              height="13"
              rx="3"
            ></rect>

            <path
              d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"
            />

          </svg>

        </button>


        <!-- send -->

        <button
          id="sendBtn"
          class="btn primary icon send-btn"
          type="submit"
          title="Send"
          aria-label="Send"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <path d="M22 2 11 13"></path>
            <path d="m22 2-7 20-4-9-9-4Z"></path>

          </svg>

        </button>

      </form>


      <footer class="footer">
        IP BABA — Your Digital Growth Partner ·
        Sargodha, Punjab, Pakistan
      </footer>

    </section>

  </section>

</main>


<!-- ================= LIVE VOICE ================= -->

<div
  id="liveOverlay"
  class="live-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-label="JARVIS Live Voice"
>

  <div class="live-card">

    <div class="live-top">

      <h3>
        JARVIS Live Voice
      </h3>

      <span>
        Realtime AI Audio
      </span>

    </div>


    <div class="live-stage">

      <canvas id="robotLive"></canvas>

    </div>


    <div class="live-info">

      <div class="live-status">

        <strong id="liveStatus">
          CONNECTING
        </strong>

        <span id="liveInfo">
          Starting secure realtime voice connection…
        </span>

      </div>


      <div
        id="liveError"
        class="error-box"
      ></div>


      <div class="live-actions">

        <button
          id="endLive"
          class="btn danger"
          type="button"
        >
          End Conversation

  function escapeHtml(value){

    return String(value).replace(
      /[&<>"']/g,

      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

  }


  function renderMarkdown(src){

    let s =
      escapeHtml(src);

    const blocks=[];


    s=s.replace(
      /```(?:\w+)?\n?([\s\S]*?)```/g,

      (_,code)=>{

        const i=blocks.length;

        blocks.push(
          '<pre>' +
          code.trim() +
          '</pre>'
        );

        return '@@CODE'+i+'@@';

      }
    );


    s=s.replace(
      /^### (.+)$/gm,
      '<h3>$1</h3>'
    );


    s=s.replace(
      /\*\*(.+?)\*\*/g,
      '<strong>$1</strong>'
    );


    s=s.replace(
      /`([^`]+)`/g,
      '<code>$1</code>'
    );


    s=s.replace(
      /^(?:[-*]) (.+)$/gm,
      '<li>$1</li>'
    );


    s=s.replace(
      /(<li>.*<\/li>)/gs,
      '<ul>$1</ul>'
    );


    s=s.replace(
      /\n{2,}/g,
      '</p><p>'
    );


    s=s.replace(
      /\n/g,
      '<br>'
    );


    s='<p>'+s+'</p>';


    s=s.replace(
      /@@CODE(\d+)@@/g,
      (_,i)=>blocks[Number(i)]
    );


    return s;

  }

  function RobotRenderer(
    canvas,
    getMode
  ){

    const ctx =
      canvas.getContext('2d');


    let w=0;
    let h=0;
    let dpr=1;


    const sparks =
      Array.from(
        {length:42},
        () => ({
          a:Math.random() *
            Math.PI*2,

          r:.46 +
            Math.random()*.36,

          s:.001 +
            .003*Math.random(),

          p:Math.random()*6.28
        })
      );


    function resize(){

      const rect =
        canvas.getBoundingClientRect();


      dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );


      w =
        Math.max(
          1,
          Math.floor(
            rect.width*dpr
          )
        );


      h =
        Math.max(
          1,
          Math.floor(
            rect.height*dpr
          )
        );


      canvas.width=w;

      canvas.height=h;

    }


    function pathRoundRect(
      x,
      y,
      ww,
      hh,
      r
    ){

      ctx.beginPath();

      ctx.roundRect(
        x,
        y,
        ww,
        hh,
        r
      );

    }


    function drawCircuit(
      cx,
      cy,
      scale,
      time,
      mode
    ){

      ctx.save();

      ctx.translate(
        cx,
        cy
      );

      ctx.scale(
        scale,
        scale
      );

      ctx.globalCompositeOperation =
        'source-over';


      /* glow */

      const glow =
        ctx.createRadialGradient(
          0,0,
          12,
          0,0,
          230
        );


      glow.addColorStop(
        0,
        'rgba(0,229,255,.18)'
      );


      glow.addColorStop(
        1,
        'rgba(0,229,255,0)'
      );


      ctx.fillStyle=glow;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        240,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* orbital circuit lines */

      ctx.strokeStyle =
        'rgba(0,229,255,.35)';

      ctx.lineWidth=2;


      for(
        let i=0;
        i<7;
        i++
      ){

        const a =
          time*
          (.12+i*.015) +
          (i%2 ? .7 : 0);


        ctx.beginPath();

        ctx.arc(
          0,
          0,
          165+i*9,
          a,
          a+
          Math.PI*
          (.45+.1*(i%3))
        );

        ctx.stroke();

      }


      /* antenna */

      ctx.strokeStyle='#0f8cff';

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.moveTo(
        0,
        -152
      );

      ctx.lineTo(
        0,
        -185
      );

      ctx.stroke();


      ctx.fillStyle =
        mode==='speaking'
          ? '#e50914'
          : '#00e5ff';


      ctx.beginPath();

      ctx.arc(
        0,
        -191,
        8 +
        Math.sin(time*5)*1.4,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* head board */

      pathRoundRect(
        -118,
        -118,
        236,
        158,
        34
      );


      const headGrad =
        ctx.createLinearGradient(
          -118,
          -118,
          118,
          40
        );


      headGrad.addColorStop(
        0,
        '#0d1a2a'
      );


      headGrad.addColorStop(
        .5,
        '#081321'
      );


      headGrad.addColorStop(
        1,
        '#101f31'
      );


      ctx.fillStyle=headGrad;

      ctx.fill();


      ctx.strokeStyle='#1c98ff';

      ctx.lineWidth=2.8;

      ctx.stroke();


      /* top traces */

      ctx.strokeStyle =
        'rgba(0,229,255,.55)';

      ctx.lineWidth=2;


      for(
        let i=-80;
        i<=80;
        i+=40
      ){

        ctx.beginPath();

        ctx.moveTo(
          i,
          -108
        );

        ctx.lineTo(
          i+18,
          -126
        );

        ctx.lineTo(
          i+48,
          -126
        );

        ctx.stroke();

      }


      /* eye glow */

      const eyeY=-46;


      const eyeGlow=
        ctx.createRadialGradient(
          -45,
          eyeY,
          2,
          -45,
          eyeY,
          34
        );


      eyeGlow.addColorStop(
        0,
        'rgba(0,229,255,.85)'
      );

      eyeGlow.addColorStop(
        1,
        'rgba(0,229,255,0)'
      );


      ctx.fillStyle=eyeGlow;

      ctx.beginPath();

      ctx.arc(
        -45,
        eyeY,
        34,
        0,
        Math.PI*2
      );

      ctx.fill();


      const eyeGlow2=
        ctx.createRadialGradient(

          eyeY,
          2,
          45,
          eyeY,
          34
        );


      eyeGlow2.addColorStop(
        0,
        'rgba(0,229,255,.85)'
      );

      eyeGlow2.addColorStop(
        1,
        'rgba(0,229,255,0)'
      );


      ctx.fillStyle=eyeGlow2;

      ctx.arc(
        45,
        eyeY,
        34,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* eyes */

      ctx.fillStyle='#dffcff';

      ctx.shadowColor='#00e5ff';


      pathRoundRect(
        -64,
        eyeY-7,
        38,
        12,
        6
      );

      pathRoundRect(
        26,
        eyeY-7,
        38,
        12,
        6
      );

      ctx.fill();


      ctx.shadowBlur=0;


      /* mouth equalizer */

      ctx.strokeStyle =
        mode==='speaking'

          : '#00e5ff';


      ctx.lineWidth=3;


      for(
        let i=-5;
        i<=5;
        i++
      ){

        const bh =
          mode==='speaking'
            ? 10 +
              Math.abs(
                Math.sin(
                  time*8+i
                )
              )*26

            : 8 +
              Math.abs(
                Math.sin(
                  time*2+i
                )
              )*7;


        ctx.beginPath();

        ctx.moveTo(
          i*9,
          15-bh/2
        );

        ctx.lineTo(
          i*9,
          15+bh/2
        );

        ctx.stroke();

      }


      /* neck */

      ctx.strokeStyle='#0c7cff';

      ctx.lineWidth=9;

      ctx.beginPath();

      ctx.moveTo(-26,40);

      ctx.lineTo(-26,68);

      ctx.moveTo(26,40);

      ctx.lineTo(26,68);

      ctx.stroke();


      /* body */

      pathRoundRect(
        -154,
        67,
        308,
        154,
        42
      );


      ctx.fillStyle='#07111e';

      ctx.fill();


      ctx.strokeStyle='#126fff';

      ctx.lineWidth=3;

      ctx.stroke();


      /* chest */

      ctx.fillStyle='#0b2136';


      pathRoundRect(
        -54,
        92,
        108,
        86,
        22
      );


      ctx.fill();


      ctx.strokeStyle =
        mode==='thinking'
          ? '#e50914'
          : '#00e5ff';


      ctx.lineWidth=3;

      ctx.stroke();


      const pulse =
        38 +
        Math.sin(
          time *
          (
            mode==='thinking'
              ? 6
              : 2.8
          )
        ) *
        6;


      ctx.shadowBlur=22;

      ctx.shadowColor =
        mode==='speaking'
          ? '#e50914'
          : '#00e5ff';


      ctx.fillStyle =
        mode==='speaking'
          ? '#e50914'
          : '#00e5ff';


      ctx.beginPath();

      ctx.arc(
        0,
        136,
        pulse*.42,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.shadowBlur=0;


      /* arms */

      ctx.strokeStyle='#167dff';

      ctx.lineWidth=9;

      ctx.lineCap='round';

      ctx.beginPath();

      ctx.moveTo(
        -147,
        98
      );

      ctx.lineTo(
        -181,
        130
      );

      ctx.lineTo(
        -191,
        176
      );


      ctx.moveTo(
        147,
        98
      );

      ctx.lineTo(
        181,
        130
      );

      ctx.lineTo(
        191,
        176
      );

      ctx.stroke();


      ctx.fillStyle='#00e5ff';


      [-191,191].forEach(
        x=>{

          ctx.beginPath();

          ctx.arc(
            x,
            176,
            7,
            0,
            Math.PI*2
          );

          ctx.fill();

        }
      );


      /* circuit traces */

      ctx.strokeStyle =
        'rgba(0,229,255,.48)';

      ctx.lineWidth=2;


      const traces=[

        [-120,98,-82,98,-82,116],

        [-120,126,-66,126,-66,150],

        [120,100,84,100,84,120],

        [120,130,66,130,66,151],

        [-90,194,-90,214,-42,214],

        [90,194,90,214,42,214]

      ];


      traces.forEach(
        a=>{

          ctx.beginPath();

          ctx.moveTo(
            a[0],
            a[1]
          );


          for(
            let i=2;
            i<a.length;
            i+=2
          ){

            ctx.lineTo(
              a[i],
              a[i+1]
            );

          }


          ctx.stroke();

        }
      );


      ctx.restore();


      /* particles */

      ctx.save();

      ctx.translate(
        cx,
        cy
      );


      for(
        let i=0;
        i<sparks.length;
        i++
      ){

        const p=sparks[i];

        p.a += p.s;

        const rr =
          Math.min(
            w,
            h
          ) * .40 * p.r;


        const x =
          Math.cos(
            p.a
          ) * rr;


        const y =
          Math.sin(
            p.a
          ) * rr * .72;


        const alpha =
          .18 +
          .65 *
          Math.abs(
            Math.sin(
              time*2+p.p
            )
          );


        ctx.fillStyle =
          `rgba(0,229,255,${alpha})`;


        ctx.beginPath();

        ctx.arc(
          x,
          y,
          (1.1+alpha*1.8)*dpr,
          0,
          Math.PI*2
        );

        ctx.fill();

      }


      ctx.restore();

    }


    function frame(t){

      const time =
        t*.001;


      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      const m =
        getMode();


      const scale =
        Math.min(
          w,
          h
        )*.00102;


      drawCircuit(
        w/(dpr*2),
        h/(dpr*2),
        scale,
        time,
        m
      );


      requestAnimationFrame(
        frame
      );

    }


    window.addEventListener(
      'resize',
      resize
    );


    resize();

    requestAnimationFrame(
      frame
    );

  }


  let robotMode='idle';


  /*
     SAME renderer used twice:
     1) Text Chat visual
     2) Live Voice visual
  */

  RobotRenderer(
    els.mainCanvas,
    () => robotMode
  );


  RobotRenderer(
    els.liveCanvas,
    () => robotMode
  );


  /* ======================================================
     LIVE VOICE VARIABLES
  ====================================================== */

  let liveSocket=null;

  let liveToken=null;

  let resumeToken=null;

  let liveReady=false;

  let setupTimer=null;

  let liveAudioCtx=null;

  let mediaStream=null;

  let sourceNode=null;

  let workletNode=null;

  let scriptNode=null;

  let liveAudioSources=[];

  let nextPlayTime=0;


  /* ======================================================
     BASE64
  ====================================================== */

  function b64ToBytes(b64){

    const bin=
      atob(b64);


    const bytes=
      new Uint8Array(
        bin.length
      );


    for(
      let i=0;
      i<bin.length;
      i++
    ){

      bytes[i]=
        bin.charCodeAt(i);

    }


    return bytes;

  }


  function bytesToB64(bytes){

    let out='';

    const step=0x6000;


    for(
      let i=0;
      i<bytes.length;
      i+=step
    ){

      let chunk='';


      for(
        let j=i;
        j<
          Math.min(
            i+step,
            bytes.length
          );
        j++
      ){

        chunk +=
          String.fromCharCode(
            bytes[j]
          );

      }


      out += chunk;

    }


    return btoa(out);

  }


  /* ======================================================
     LIVE UI
  ====================================================== */

  function showLiveText(
    status,
    message,
    error=''
  ){

    els.liveStatus.textContent=
      status;


    els.liveInfo.textContent=
      message;


    els.liveError.textContent=
      error;


    els.liveError.style.display =
      error
        ? 'block'
        : 'none';

  }


  function showLive(){

    els.overlay.classList.remove(
      'hidden'
    );

  }


  function hideLive(){

    els.overlay.classList.add(
      'hidden'
    );

  }


  /* ======================================================
     LIVE TOKEN
  ====================================================== */

  async function getLiveToken(){

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () => controller.abort(),
        15000
      );


    try{

      const r =
        await fetch(
          API_BASE_URL +
          '/api/live-token',

          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:'{}',

            signal:controller.signal
          }
        );


      const d =
        await r.json().catch(
          () => ({})
        );


      if(!r.ok)
        throw new Error(
          d.error ||
          ('LIVE_TOKEN_HTTP_'+
           r.status)
        );


      const token =
        d.token ||
        d.name;


      const model =
        d.model ||
        LIVE_MODEL_FALLBACK;


      if(!token)
        throw new Error(
          'Server returned no Live token.'
        );


      return {
        token,
        model
      };

    }
    finally{

      clearTimeout(timer);

    }

  }


  /* ======================================================
     PCM PLAYBACK
  ====================================================== */

  function pcm16ToFloat(bytes){

    const view =
      new DataView(
        bytes.buffer,
        bytes.byteOffset,
        bytes.byteLength
      );


    const out =
      new Float32Array(
        Math.floor(
          bytes.byteLength/2
        )
      );


    for(
      let i=0;
      i<out.length;
      i++
    ){

      out[i]=
        Math.max(
          -1,
          Math.min(
            1,
            view.getInt16(
              i*2,
              true
            )/32768
          )
        );

    }


    return out;

  }


  function playPcm(b64){

    if(!liveAudioCtx)
      return;


    const bytes =
      b64ToBytes(b64);


    const floats =
      pcm16ToFloat(bytes);


    /*
       Gemini Live output:
       PCM 16-bit / 24kHz
    */

    const buffer =
      liveAudioCtx.createBuffer(
        1,
        floats.length,
        24000
      );


    buffer.copyToChannel(
      floats,
      0
    );


    const src =
      liveAudioCtx.createBufferSource();


    src.buffer=buffer;


    const gain =
      liveAudioCtx.createGain();


    gain.gain.value=.96;


    src.connect(
      gain
    ).connect(
      liveAudioCtx.destination
    );


    const now =
      liveAudioCtx.currentTime;


    nextPlayTime =
      Math.max(
        nextPlayTime,
        now+.02
      );


    src.start(
      nextPlayTime
    );


    nextPlayTime +=
      buffer.duration;


    liveAudioSources.push(
      src
    );


    robotMode='speaking';


    src.onended=()=>{

      liveAudioSources =
        liveAudioSources.filter(
          x=>x!==src
        );


      if(
        !liveAudioSources.length &&
        liveReady
      ){

        robotMode='listening';

      }

    };

  }


  function stopLiveAudio(){

    liveAudioSources.forEach(
      source=>{

        try{
          source.stop();
        }
        catch(_){}

      }
    );


    liveAudioSources=[];

    nextPlayTime=0;

  }


  /* ======================================================
     RESAMPLE MIC TO 16kHz PCM
  ====================================================== */

  function resampleAndSend(
    input
  ){

    if(
      !liveReady ||
      !liveSocket ||
      liveSocket.readyState !==
        WebSocket.OPEN ||
      !liveAudioCtx
    ){

      return;

    }


    const inRate =
      liveAudioCtx.sampleRate;


    const outRate=16000;


    const ratio =
      inRate/outRate;


    const outLen =
      Math.floor(
        input.length/ratio
      );


    const pcm =
      new Int16Array(
        outLen
      );


    for(
      let i=0;
      i<outLen;
      i++
    ){

      const pos=i*ratio;

      const left=
        Math.floor(pos);

      const right=
        Math.min(
          left+1,
          input.length-1
        );

      const mix=
        pos-left;


      let s =
        input[left]*
        (1-mix) +
        input[right]*
        mix;


      s=
        Math.max(
          -1,
          Math.min(
            1,
            s
          )
        );


      pcm[i] =
        s<0
          ? s*0x8000
          : s*0x7fff;

    }


    try{

      liveSocket.send(
        JSON.stringify({
          realtimeInput:{
            audio:{
              data:
                bytesToB64(
                  new Uint8Array(
                    pcm.buffer
                  )
                ),
              mimeType:
                'audio/pcm;rate=16000'
            }
          }
        })
      );

    }
    catch(e){

      console.warn(
        'Live audio send failed:',
        e
      );

    }

  }


  /* ======================================================
     MICROPHONE
  ====================================================== */

  async function setupMic(){

    if(
      !navigator.mediaDevices?.getUserMedia
    ){

      throw new Error(
        'This browser does not support microphone access. ' +
        'Use HTTPS and a current Chrome/Chromium browser.'
      );

    }


    mediaStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:{
            channelCount:1,
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        });


    const AC =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AC){

      throw new Error(
        'Web Audio is not supported in this browser.'
      );

    }


    liveAudioCtx =
      new AC();


    await liveAudioCtx.resume();


    sourceNode =
      liveAudioCtx.createMediaStreamSource(
        mediaStream
      );


    /*
       Primary method:
       AudioWorklet
    */

    if(
      liveAudioCtx.audioWorklet
    ){

      const code = `
        class JARVISPCM extends AudioWorkletProcessor{

          process(inputs){

            const input =
              inputs[0] &&
              inputs[0][0];

            if(input){

              const data =
                new Float32Array(
                  input.length
                );

              data.set(input);

              this.port.postMessage(
                data,
                [data.buffer]
              );

            }

            return true;
          }

        }

        registerProcessor(
          'jarvis-pcm',
          JARVISPCM
        );
      `;


      const url =
        URL.createObjectURL(
          new Blob(
            [code],
            {
              type:
                'application/javascript'
            }
          )
        );


      await liveAudioCtx
        .audioWorklet
        .addModule(url);


      URL.revokeObjectURL(
        url
      );


      workletNode =
        new AudioWorkletNode(
          liveAudioCtx,
          'jarvis-pcm'
        );


      sourceNode.connect(
        workletNode
      );


      workletNode.port.onmessage =
        event =>
          resampleAndSend(
            event.data
          );


      const mute =
        liveAudioCtx.createGain();


      mute.gain.value=0;


      workletNode
        .connect(mute)
        .connect(
          liveAudioCtx.destination
        );

    }

    /*
       Fallback:
       ScriptProcessor
    */

    else{

      scriptNode =
        liveAudioCtx.createScriptProcessor(
          4096,
          1,
          1
        );


      sourceNode.connect(
        scriptNode
      );


      const mute =
        liveAudioCtx.createGain();


      mute.gain.value=0;


      scriptNode
        .connect(mute)
        .connect(
          liveAudioCtx.destination
        );


      scriptNode.onaudioprocess =
        event =>
          resampleAndSend(
            event.inputBuffer
              .getChannelData(0)
          );

    }

  }


  function closeMic(){

    try{
      workletNode?.disconnect();
    }
    catch(_){}


    try{
      scriptNode?.disconnect();
    }
    catch(_){}


    try{
      sourceNode?.disconnect();
    }
    catch(_){}


    mediaStream
      ?.getTracks()
      .forEach(
        track =>
          track.stop()
      );


    workletNode=null;

    scriptNode=null;

    sourceNode=null;

    mediaStream=null;


    if(liveAudioCtx){

      liveAudioCtx
        .close()
        .catch(()=>{});

      liveAudioCtx=null;

    }

  }


  function clearSetupTimer(){

    if(setupTimer){

      clearTimeout(
        setupTimer
      );

      setupTimer=null;

    }

  }


  function failLive(
    message,
    detail=''
  ){

    liveReady=false;

    robotMode='idle';

    clearSetupTimer();


    showLiveText(
      'LIVE ERROR',
      message,
      detail
    );


    setMode(
      'error',
      'LIVE VOICE ERROR'
    );

  }


  /* ======================================================
     OPEN LIVE
  ====================================================== */

  async function openLive(){

    if(liveSocket)
      return;


    state.intentionalLiveClose=false;


    showLive();


    els.live.classList.add(
      'on'
    );


    setMode(
      'live',
      'CONNECTING LIVE…'
    );


    robotMode='thinking';


    showLiveText(
      'CONNECTING',
      'Requesting secure short-lived Live token…'
    );


    try{

      const tokenData =
        await getLiveToken();


      liveToken=
        tokenData.token;


      showLiveText(
        'CONNECTING',
        'Requesting microphone permission…'
      );


      await setupMic();


      /*
         IMPORTANT:
         Ephemeral token uses the
         Constrained Live endpoint.
      */

      const ws =
        'wss://generativelanguage.googleapis.com/ws/' +
        'google.ai.generativelanguage.v1beta.' +
        'GenerativeService.' +
        'BidiGenerateContentConstrained' +
        '?access_token=' +
        encodeURIComponent(
          liveToken
        );


      liveSocket =
        new WebSocket(ws);


      liveSocket.onopen=()=>{

        /*
           The first message MUST be setup.
           responseModalities is intentionally
           placed directly in setup.
        */

        const setup={
          setup:{
            model:
              'models/' +
              tokenData.model,

            responseModalities:[
              'AUDIO'
            ],

            inputAudioTranscription:{},

            outputAudioTranscription:{},

            systemInstruction:{
              parts:[
                {
                  text:
                    SYSTEM_INSTRUCTION
                }
              ]
            }
          }
        };


        if(resumeToken){

          setup.setup.sessionResumption={
            handle:resumeToken
          };

        }


        try{

          liveSocket.send(
            JSON.stringify(setup)
          );


          showLiveText(
            'CONNECTING',
            'Configuration sent. Waiting for Live setup…'
          );


          setMode(
            'live',
            'CONNECTING…'
          );


          clearSetupTimer();


          /*
             Never allow the UI to hang
             indefinitely.
          */

          setupTimer =
            setTimeout(
              ()=>{

                if(
                  !liveReady &&
                  liveSocket
                ){

                  console.warn(
                    'Live setup timeout'
                  );


                  try{
                    liveSocket.close();
                  }
                  catch(_){}


                  failLive(
                    'Live setup did not complete within 10 seconds.',
                    'No setupComplete message was received. Check /api/live-token, the Live model, and your Gemini project configuration.'
                  );

                }

              },
              10000
            );

        }
        catch(e){

          failLive(
            'Could not send Live setup.',
            e.message ||
            String(e)
          );

        }

      };


      liveSocket.onmessage=
        event=>{

          let data;


          try{

            data =
              JSON.parse(
                event.data
              );

          }
          catch(e){

            console.warn(
              'Live JSON parse error:',
              e
            );

            return;

          }


          /*
             Real Gemini error:
             never leave screen stuck.
          */

          if(data.error){

            const er =
              data.error ||
              {};


            const detail =
              [
                er.status,
                er.code,
                er.message
              ]
                .filter(Boolean)
                .join(' | ');


            failLive(
              'Gemini Live rejected the connection.',
              detail ||
              'Unknown Gemini Live API error.'
            );


            try{
              liveSocket.close();
            }
            catch(_){}


            return;

          }


          /*
             SETUP COMPLETE
          */

          if(data.setupComplete){

            liveReady=true;

            clearSetupTimer();

            robotMode='listening';


            setMode(
              'live',
              'LISTENING…'
            );


            showLiveText(
              'LISTENING',
              'JARVIS is listening. Speak naturally.'
            );


            return;

          }


          /*
             Session resumption
          */

          if(
            data.sessionResumptionUpdate
          ){

            const h =
              data
                .sessionResumptionUpdate
                .newHandle ||
              data
                .sessionResumptionUpdate
                .token;


            if(h)
              resumeToken=h;

          }


          /*
             Server reconnect notice
          */

          if(data.goAway){

            showLiveText(
              'RECONNECTING',
              'Live session is preparing a secure reconnect…'
            );


            setTimeout(
              () => reconnectLive(),
              450
            );


            return;

          }


          const sc =
            data.serverContent;


          if(!sc)
            return;


          /*
             Input transcription
          */

          if(
            sc.inputTranscription?.text
          ){

            showLiveText(
              'LISTENING',
              sc.inputTranscription.text
            );

          }


          /*
             Output transcription
          */

          if(
            sc.outputTranscription?.text
          ){

            showLiveText(
              'SPEAKING',
              sc.outputTranscription.text
            );

          }


          /*
             User interrupted JARVIS
          */

          if(sc.interrupted){

            stopLiveAudio();

            robotMode='listening';

            setMode(
              'live',
              'LISTENING…'
            );

          }


          /*
             Audio response
          */

          if(
            sc.modelTurn?.parts
          ){

            for(
              const part
              of sc.modelTurn.parts
            ){

              const b =
                part.inlineData?.data ||
                part.inline_data?.data;


              if(b)
                playPcm(b);


              const t=
                part.text;


              if(t){

                showLiveText(
                  'SPEAKING',
                  t
                );

              }

            }

          }


          /*
             Turn complete
          */

          if(sc.turnComplete){

            if(
              !liveAudioSources.length
            ){

              robotMode='listening';

            }


            setMode(
              'live',
              'LISTENING…'
            );


            if(
              !sc.outputTranscription?.text &&
              !liveAudioSources.length
            ){

              showLiveText(
                'LISTENING',
                'JARVIS is listening.'
              );

            }

          }

        };


      liveSocket.onerror =
        e=>{

          console.warn(
            'Live WebSocket error:',
            e
          );


          if(!liveReady){

            failLive(
              'Live WebSocket connection failed.',
              'The browser could not establish a valid Gemini Live session.'
            );

          }
          else{

            showLiveText(
              'LIVE ERROR',
              'The realtime connection reported an error.',
              'Try ending the conversation and start Live Voice again.'
            );

          }

        };


      liveSocket.onclose =
        e=>{

          clearSetupTimer();


          const wasIntentional =
            state.intentionalLiveClose;


          liveSocket=null;

          liveReady=false;

          closeMic();


          if(
            !wasIntentional &&
            e.code!==1000
          ){

            showLiveText(
              'LIVE CLOSED',
              'Live connection closed.',
              e.reason ||
              (
                'WebSocket close code ' +
                e.code
              )
            );


            setMode(
              'error',
              'LIVE CLOSED'
            );


            robotMode='idle';

          }
          else if(
            !wasIntentional &&
            state.coreMode==='live'
          ){

            setMode(
              'idle',
              'JARVIS READY'
            );


            robotMode='idle';

          }

        };

    }
    catch(e){

      console.error(
        'Live start error:',
        e
      );


      let msg;


      if(
        e.name===
        'NotAllowedError'
      ){

        msg =
          'Microphone permission was denied. Allow microphone access for this site and try again.';

      }
      else if(
        e.name===
        'NotFoundError'
      ){

        msg =
          'No microphone was found on this device.';

      }
      else if(
        e.name===
        'NotReadableError'
      ){

        msg =
          'The microphone is busy or unavailable. Close other apps using it and try again.';

      }
      else if(
        e.name===
        'AbortError'
      ){

        msg =
          'The Live request timed out. Please try again.';

      }
      else{

        msg =
          e.message ||
          'Live Voice could not start.';

      }


      failLive(
        msg,
        msg
      );


      closeMic();

    }

  }


  /* ======================================================
     RECONNECT
  ====================================================== */

  async function reconnectLive(){

    if(
      state.intentionalLiveClose
    )
      return;


    try{

      if(liveSocket){

        try{
          liveSocket.close();
        }
        catch(_){}


        liveSocket=null;

      }


      closeMic();

      liveReady=false;

      robotMode='thinking';


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            350
          )
      );


      await openLive();

    }
    catch(e){

      failLive(
        'Live reconnect failed.',
        e.message ||
        String(e)
      );

    }

  }


  /* ======================================================
     CLOSE LIVE
  ====================================================== */

  function closeLive(){

    state.intentionalLiveClose=true;

    liveReady=false;

    clearSetupTimer();

    stopLiveAudio();


    try{

      liveSocket?.close(
        1000,
        'User ended conversation'
      );

    }
    catch(_){}


    liveSocket=null;


    closeMic();


    liveToken=null;


    robotMode='idle';


    els.live.classList.remove(
      'on'
    );


    hideLive();


    setMode(
      'idle',
      'JARVIS READY'
    );

  }


  els.live.onclick =
    () =>
      liveSocket
        ? closeLive()
        : openLive();


  els.endLive.onclick =
    closeLive;


  els.overlay.addEventListener(
    'click',
    e=>{

      if(
        e.target ===
        els.overlay
      ){

        closeLive();

      }

    }
  );


  window.addEventListener(
    'beforeunload',
    closeLive
  );


  /* ======================================================
     FRONTEND ERROR LOGGER
  ====================================================== */

  window.addEventListener(
    'error',
    e=>{

      console.error(
        'JARVIS frontend error:',
        e.error ||
        e.message
      );

    }
  );

})();
</script>
