<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f9fc"><title>IP BABA JARVIS — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7fbfd,#eef8f5);font-family:Inter,system-ui,sans-serif;color:#17364b}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em;color:#087fa8}.card{margin-top:22px;padding:22px;border:1px solid #dceaf0;border-radius:18px;background:#fff;box-shadow:0 15px 45px #244c6610}.muted{color:#6d8797}.btn{border:0;border-radius:10px;padding:10px 15px;background:#148db6;color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf4f8;color:#24536c}.status{padding:12px;border-radius:10px;background:#f0f7fa;color:#45697c}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6eef2;white-space:nowrap}th{color:#567589;background:#f7fbfc}.pill{padding:4px 8px;border-radius:30px;background:#e8f7ef;color:#16835b}.hidden{display:none!important}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">IP BABA • JARVIS CONTROL</div><h1 style="margin:8px 0">Admin Dashboard</h1><div class="muted">Secure user management overview</div></div><button class="btn secondary" id="signout">Sign out</button></header><section class="card"><div id="status" class="status">Checking administrator access…</div><div id="content" class="hidden"><h2>User Management</h2><p class="muted">Firebase Authentication accounts. Chat messages remain local on each user's device and are not visible here.</p><div class="tablewrap"><table><thead><tr><th>Email</th><th>Name</th><th>Verified</th><th>Status</th><th>Created</th></tr></thead><tbody id="users"></tbody></table></div></div></section></main>
<script type="module">
import {auth,signOut} from "./js/firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
const status=document.getElementById("status"),content=document.getElementById("content"),tbody=document.getElementById("users");
onAuthStateChanged(auth,async user=>{if(!user){status.textContent="Please sign in with the administrator account on the JARVIS home page.";return;}try{const token=await user.getIdToken(true);const r=await fetch("/api/admin",{headers:{Authorization:"Bearer "+token}});const data=await r.json();if(!r.ok)throw new Error(data.error||"Access denied");status.innerHTML='<span class="pill">Administrator verified</span> · '+data.users.length+' accounts listed';content.classList.remove("hidden");tbody.innerHTML=data.users.map(u=>'<tr><td>'+esc(u.email)+'</td><td>'+esc(u.displayName)+'</td><td>'+(u.emailVerified?"Yes":"No")+'</td><td>'+(u.disabled?"Disabled":"Active")+'</td><td>'+esc(u.createdAt)+'</td></tr>').join("");}catch(e){status.textContent=e.message==="admin_only"?"This account is not authorized as an administrator.":e.message;content.classList.add("hidden");}});
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
document.getElementById("signout").onclick=()=>signOut(auth);
</script></body></html>
